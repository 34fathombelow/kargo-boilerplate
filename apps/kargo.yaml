apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: upgrade-kargo-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/34fathombelow/kargo-boilerplate.git
        revision: main
        files:
          - path: "config/apps/*.yaml"
  template:
    metadata:
      name: '{{.stamp}}-kargo-{{.appName}}'
    spec:
      project: kargo-project
      source:
        repoURL: https://github.com/34fathombelow/kargo-boilerplate.git
        targetRevision: main
        path: .
        helm:
          valuesObject:
            nameOverride: '{{.stamp}}-{{.appName}}'
            warehouse:
              subscriptions:
                - chart:
                    repoURL: '{{ .registry }}/{{ .chartName }}'
                - image:
                    repoURL: '{{.image}}'
            project:
              promotionPolicies:
                - stage: dev
                  autoPromotionEnabled: true
                - stage: test
                  autoPromotionEnabled: false
                # - stage: production-<region>
                #   autoPromotionEnabled: false
            stages:
              - name: dev
                annotations:
                  kargo.akuity.io/color: orange
                requestedFreight:
                  - origin:
                      kind: Warehouse
                      name: '{{.stamp}}-{{.appName}}'
                    sources:
                      direct: true
                # shard: <kargo_agent_for_testing>
                # verification:
                #   analysisTemplates:
                #     - name: kargo-integration-tests
                #   args:
                #     - name: service
                #       value: '{{.chartName}}-canary'
                #     - name: namespace
                #       value: '{{.appName}}'
                promotionTemplate:
                  spec:
                    steps:
                      - uses: argocd-update
                        config:
                          apps:
                            - name: '{{.stamp}}-{{.appName}}-testing'
                              sources:
                                - chart: '{{ .chartName }}'
                                  repoURL: '{{ .registry }}'
                                  helm:
                                    images:
                                    - repoURL: '{{ .registry }}/{{ .appName }}'
                                      key: image.tag
                                      value: Tag
                                - repoURL: '{{ .registry }}'
                                  chart: '{{ .chartName }}'
                                  updateTargetRevision: true
              - name: test
                annotations:
                  kargo.akuity.io/color: green
                requestedFreight:
                  - origin:
                      kind: Warehouse
                      name: '{{.stamp}}-{{.appName}}'
                    sources:
                      stages:
                        - dev
                # shard: <kargo_agent_for_preview>
                # verification:
                #   analysisTemplates:
                #     - name: kargo-integration-tests
                #   args:
                #     - name: service
                #       value: '{{.appName}}-canary'
                #     - name: namespace
                #       value: '{{.appName}}'
                promotionTemplate:
                  spec:
                    steps:
                      - uses: argocd-update
                        # retry:
                        #   errorThreshold: 3
                        #   timeout: 1h
                        config:
                          apps:
                            - name: '{{.stamp}}-{{.appName}}-preview'
                              sources:
                                - chart: '{{ .chartName }}'
                                  repoURL: '{{ .registry }}'
                                  helm:
                                    images:
                                    - repoURL: '{{ .registry }}/{{ .appName }}'
                                      key: image.tag
                                      value: Tag
                                - repoURL: '{{ .registry }}'
                                  chart: '{{ .chartName }}'
                                  updateTargetRevision: true
      destination:
        name: kargo1
      syncPolicy:
        automated: {}
        retry:
          limit: 5
          backoff:
            duration: 5s
            maxDuration: 3m0s
            factor: 2
        syncOptions:
        - CreateNamespace=true
   
